name: publish-npm
run-name: "neo-research npm ${{ inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "npm version to publish"
        required: true
        type: string
        default: "0.1.0-alpha.0"
      dry_run:
        description: "pack all npm artifacts without publishing"
        required: false
        type: boolean
        default: false

concurrency: neo-research-npm-${{ inputs.version }}

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NEO_RESEARCH_VERSION: ${{ inputs.version }}
      NEO_RESEARCH_CHANNEL: alpha
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Verify package boundary
        run: bun test test/release-boundary.test.ts
        working-directory: packages/opencode

      - name: Verify Research OS service
        run: bun test test/research/service.test.ts --timeout 30000
        working-directory: packages/opencode

      - name: Typecheck
        run: bun run typecheck
        working-directory: packages/opencode

      - name: Build platform npm packages
        run: ./packages/opencode/script/build.ts --all-targets

      - name: Pack npm artifacts
        if: ${{ inputs.dry_run }}
        run: ./packages/opencode/script/publish.ts
        env:
          NEO_RESEARCH_PUBLISH_DRY_RUN: "1"

      - name: Publish npm artifacts
        if: ${{ !inputs.dry_run }}
        run: ./packages/opencode/script/publish.ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
